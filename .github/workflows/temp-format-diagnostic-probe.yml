name: Temporary counterfactual probe formatting
on:
  push:
    branches: ["experiment/counterfactual-anm-cue-v1-20261121"]
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev --extra anm --python 3.12
      - run: uv run --extra anm ruff check --fix examples/diagnostic_counterfactual_probe.py tests/test_diagnostic_counterfactual_probe.py
      - run: uv run --extra anm ruff format examples/diagnostic_counterfactual_probe.py tests/test_diagnostic_counterfactual_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-diagnostic-probe
          path: |
            examples/diagnostic_counterfactual_probe.py
            tests/test_diagnostic_counterfactual_probe.py
          retention-days: 1
